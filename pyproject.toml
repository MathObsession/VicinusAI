[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vicinusai"
version = "0.1.6"
description = "Dual-server AI console: Flask web UI + TurboFieldfare Gemma 4 inference"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "MathObsession" }]
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
]

[project.scripts]
vicinus-ai = "vicinusai.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vicinusai*"]
